rules:
  - id: shipguard.go.hardcoded-credentials
    languages: [go]
    severity: WARNING
    message: >-
      A credential-like variable is assigned a string literal, so the secret
      lives in source control. Load it from the environment or a secret
      manager at runtime and rotate the exposed value.
    patterns:
      - pattern-either:
          - pattern: $NAME := "$VALUE"
          - pattern: $NAME = "$VALUE"
          - pattern: var $NAME = "$VALUE"
          - pattern: var $NAME string = "$VALUE"
          - pattern: const $NAME = "$VALUE"
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)^(?!.*(url|name|type|label|path|file)$).*(password|passwd|secret|api_?key|token|credential)
      - metavariable-regex:
          metavariable: $VALUE
          # Skip URLs, text with whitespace, and short lowercase identifier-like
          # values ("secrets", "password", "token_type"): enum/kind constants.
          regex: ^(?![a-z][a-z0-9+.-]*://)(?![a-z]+([_-][a-z]+)?$)(?!.*\s).{6,}$
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confidence: LOW
