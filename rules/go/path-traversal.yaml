rules:
  - id: shipguard.go.path-traversal
    languages: [go]
    mode: taint
    severity: ERROR
    message: >-
      A value taken from the HTTP request reaches a file system call without
      being reduced to a safe name, so "../" sequences can read or write files
      outside the intended directory. Use filepath.Base on the value, or
      resolve the path and verify it stays inside the allowed root.
    pattern-sources:
      - pattern: $R.URL.Query().Get(...)
      - pattern: $R.FormValue(...)
      - pattern: $R.PostFormValue(...)
      - pattern: $R.PathValue(...)
    pattern-sanitizers:
      - pattern: filepath.Base(...)
      - pattern: path.Base(...)
    pattern-sinks:
      - patterns:
          - pattern: os.Open($P)
          - focus-metavariable: $P
      - patterns:
          - pattern: os.OpenFile($P, ...)
          - focus-metavariable: $P
      - patterns:
          - pattern: os.ReadFile($P)
          - focus-metavariable: $P
      - patterns:
          - pattern: os.WriteFile($P, ...)
          - focus-metavariable: $P
      - patterns:
          - pattern: os.Remove($P)
          - focus-metavariable: $P
      - patterns:
          - pattern: os.RemoveAll($P)
          - focus-metavariable: $P
      - patterns:
          - pattern: os.Create($P)
          - focus-metavariable: $P
      - patterns:
          - pattern: http.ServeFile($W, $R, $P)
          - focus-metavariable: $P
    metadata:
      category: security
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      confidence: MEDIUM
