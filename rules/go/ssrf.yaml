rules:
  - id: shipguard.go.ssrf
    languages: [go]
    mode: taint
    severity: ERROR
    message: >-
      A URL taken from the HTTP request is fetched by the server, which lets
      an attacker reach internal services and cloud metadata endpoints. Only
      accept destinations from an allow-list, or build the URL from a fixed
      host and validate the user-supplied part.
    pattern-sources:
      - pattern: $R.URL.Query().Get(...)
      - pattern: $R.FormValue(...)
      - pattern: $R.PostFormValue(...)
      - pattern: $R.Header.Get(...)
    pattern-sinks:
      - patterns:
          - pattern: http.Get($URL)
          - focus-metavariable: $URL
      - patterns:
          - pattern: http.Head($URL)
          - focus-metavariable: $URL
      - patterns:
          - pattern: http.Post($URL, ...)
          - focus-metavariable: $URL
      - patterns:
          - pattern: http.PostForm($URL, ...)
          - focus-metavariable: $URL
      - patterns:
          - pattern: "($C : *http.Client).Get($URL)"
          - focus-metavariable: $URL
      - patterns:
          - pattern: "($C : *http.Client).Head($URL)"
          - focus-metavariable: $URL
      - patterns:
          - pattern: "($C : *http.Client).Post($URL, ...)"
          - focus-metavariable: $URL
      - patterns:
          - pattern: "($C : *http.Client).PostForm($URL, ...)"
          - focus-metavariable: $URL
      - patterns:
          - pattern: http.NewRequest($M, $URL, ...)
          - focus-metavariable: $URL
      - patterns:
          - pattern: http.NewRequestWithContext($CTX, $M, $URL, ...)
          - focus-metavariable: $URL
    metadata:
      category: security
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      confidence: MEDIUM
