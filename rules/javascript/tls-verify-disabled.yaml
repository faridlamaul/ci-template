rules:
  - id: shipguard.javascript.tls-verify-disabled
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      TLS certificate verification is turned off, so any attacker on the
      network path can impersonate the server. Remove rejectUnauthorized: false
      and NODE_TLS_REJECT_UNAUTHORIZED=0 and trust the right CA through the ca
      option instead.
    pattern-either:
      - pattern: "{..., rejectUnauthorized: false, ...}"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = 0
    metadata:
      category: security
      cwe: "CWE-295: Improper Certificate Validation"
      confidence: HIGH
