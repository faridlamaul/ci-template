rules:
  - id: shipguard.javascript.weak-crypto
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      MD5, SHA-1, DES and RC4 are broken for security purposes. Use SHA-256 or
      SHA-3 for hashing, bcrypt, scrypt or argon2 for passwords, and AES-GCM
      for encryption.
    patterns:
      - pattern-either:
          - pattern: $C.createHash($ALG)
          - pattern: $C.createCipheriv($ALG, ...)
          - pattern: $C.createDecipheriv($ALG, ...)
      - metavariable-regex:
          metavariable: $ALG
          regex: (?i)^["'](md5|sha-?1|des(-.*)?|rc4|rc2(-.*)?|bf(-.*)?|blowfish)["']$
    metadata:
      category: security
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      confidence: HIGH
