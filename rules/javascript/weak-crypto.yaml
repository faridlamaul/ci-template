rules:
  - id: shipguard.javascript.weak-crypto
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      MD5, SHA-1, DES and RC4 are broken for security purposes. Use SHA-256 or
      SHA-3 for hashing, bcrypt, scrypt or argon2 for passwords, and AES-GCM
      for encryption.
    pattern-either:
      - pattern: $C.createHash("md5")
      - pattern: $C.createHash("sha1")
      - pattern: $C.createHash('md5')
      - pattern: $C.createHash('sha1')
      - pattern: $C.createCipheriv("des", ...)
      - pattern: $C.createCipheriv("des-ede3", ...)
      - pattern: $C.createCipheriv("rc4", ...)
      - pattern: $C.createCipher(...)
    metadata:
      category: security
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      confidence: HIGH
