rules:
  - id: shipguard.javascript.hardcoded-credentials
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A credential-like variable or property is assigned a string literal, so
      the secret lives in source control. Load it from the environment or a
      secret manager at runtime and rotate the exposed value.
    patterns:
      - pattern-either:
          - pattern: const $NAME = "$VALUE"
          - pattern: let $NAME = "$VALUE"
          - pattern: var $NAME = "$VALUE"
          - pattern: "{..., $NAME: \"$VALUE\", ...}"
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)^.*(password|passwd|secret|api_?key|token|credential).*$
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^.{6,}$
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confidence: LOW
