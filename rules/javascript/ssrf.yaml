rules:
  - id: shipguard.javascript.ssrf
    languages: [javascript, typescript]
    mode: taint
    severity: ERROR
    message: >-
      A URL taken from the HTTP request is fetched by the server, which lets an
      attacker reach internal services and cloud metadata endpoints. Only
      accept destinations from an allow-list, or build the URL from a fixed
      host and validate the user-supplied part.
    pattern-sources:
      - pattern: $REQ.query.$P
      - pattern: $REQ.params.$P
      - pattern: $REQ.body.$P
    pattern-sinks:
      - pattern: fetch($URL, ...)
      - pattern: axios($URL, ...)
      - pattern: axios.$M($URL, ...)
      - pattern: got($URL, ...)
      - pattern: got.$M($URL, ...)
      - pattern: http.get($URL, ...)
      - pattern: https.get($URL, ...)
      - pattern: http.request($URL, ...)
      - pattern: https.request($URL, ...)
    metadata:
      category: security
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      confidence: MEDIUM
