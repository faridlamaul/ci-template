rules:
  - id: shipguard.ruby.hardcoded-credentials-dsn
    languages: [ruby]
    severity: WARNING
    message: >-
      A database or broker connection URL embeds an inline password, so the
      secret lives in source control. Build the URL from the environment or a
      secret manager at runtime and rotate the exposed password.
    # A database or broker connection URL with an inline password, whatever
    # it is assigned to. Placeholders (${VAR}, $VAR, <password>, {name},
    # %s, #{...}, ***) and the literal word "password" are skipped.
    patterns:
      - pattern: '"$DSN"'
      - metavariable-regex:
          metavariable: $DSN
          regex: (?i)^(postgres(ql)?|mysql|mariadb|mongodb(\+srv)?|rediss?|amqps?|mssql|sqlserver)://[^:/@\s]*:(?!password@)(?![$<{%*#])[^@\s/]+@
    # Report the literal only, not every later use of a variable holding it.
    options:
      constant_propagation: false
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confidence: LOW
