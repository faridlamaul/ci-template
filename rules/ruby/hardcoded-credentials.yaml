rules:
  - id: shipguard.ruby.hardcoded-credentials
    languages: [ruby]
    severity: WARNING
    message: >-
      A credential-like variable, constant or option is assigned a string
      literal, so the secret lives in source control. Load it from the
      environment, Rails credentials or a secret manager and rotate the exposed
      value.
    patterns:
      - pattern-either:
          - pattern: $NAME = "$VALUE"
          - pattern: "$M(..., $NAME: \"$VALUE\", ...)"
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)^(?!.*(url|name|type|label|path|file)$).*(password|passwd|secret|api_?key|token|credential)
      - metavariable-regex:
          metavariable: $VALUE
          # Skip URLs, text with whitespace, and short lowercase identifier-like
          # values ("secrets", "password", "token_type"): enum/kind constants.
          regex: ^(?![a-z][a-z0-9+.-]*://)(?![a-z]+([_-][a-z]+)?$)(?!.*\s).{6,}$
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confidence: LOW
