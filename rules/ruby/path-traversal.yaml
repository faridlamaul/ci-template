rules:
  - id: shipguard.ruby.path-traversal
    languages: [ruby]
    mode: taint
    severity: ERROR
    message: >-
      A value from the HTTP request reaches a file system call without being
      reduced to a safe name, so "../" sequences can read or write files
      outside the intended directory. Use File.basename on the value, or expand
      the path and verify it stays inside the allowed root.
    pattern-sources:
      - pattern: params[...]
      - pattern: params.fetch(...)
      - pattern: params.require(...)
    pattern-sanitizers:
      - pattern: File.basename(...)
    pattern-sinks:
      - pattern: File.read(...)
      - pattern: File.open(...)
      - pattern: File.write(...)
      - pattern: File.delete(...)
      - pattern: File.binread(...)
      - pattern: IO.read(...)
      - pattern: send_file(...)
      - pattern: FileUtils.rm_rf(...)
    metadata:
      category: security
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      confidence: MEDIUM
