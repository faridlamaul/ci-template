rules:
  - id: shipguard.python.unsafe-deserialization
    languages: [python]
    severity: ERROR
    message: >-
      Deserializing with pickle, marshal, shelve or yaml.load with an unsafe
      loader can execute arbitrary code from crafted input. Use json, or
      yaml.safe_load, and never unpickle data from an untrusted source.
    patterns:
      - pattern-either:
          - pattern: pickle.load(...)
          - pattern: pickle.loads(...)
          - pattern: cPickle.load(...)
          - pattern: cPickle.loads(...)
          - pattern: marshal.load(...)
          - pattern: marshal.loads(...)
          - pattern: dill.load(...)
          - pattern: dill.loads(...)
          - pattern: yaml.load(...)
          - pattern: yaml.load_all(...)
          - pattern: yaml.unsafe_load(...)
          - pattern: yaml.full_load(...)
      - pattern-not: yaml.load(..., Loader=yaml.SafeLoader)
      - pattern-not: yaml.load(..., Loader=yaml.CSafeLoader)
      - pattern-not: yaml.load(..., Loader=SafeLoader)
      - pattern-not: yaml.load_all(..., Loader=yaml.SafeLoader)
      - pattern-not: yaml.load_all(..., Loader=SafeLoader)
    metadata:
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
      confidence: HIGH
