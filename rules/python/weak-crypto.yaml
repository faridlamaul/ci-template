rules:
  - id: shipguard.python.weak-crypto
    languages: [python]
    severity: WARNING
    message: >-
      MD5, SHA-1, DES and RC4 are broken for security purposes. Use SHA-256 or
      SHA-3 for hashing, bcrypt, scrypt or argon2 for passwords, and AES-GCM or
      ChaCha20-Poly1305 for encryption. If the hash is not security relevant,
      pass usedforsecurity=False.
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)
          - pattern: hashlib.new("md5", ...)
          - pattern: hashlib.new("sha1", ...)
          - pattern: DES.new(...)
          - pattern: DES3.new(...)
          - pattern: ARC4.new(...)
          - pattern: Crypto.Cipher.DES.new(...)
          - pattern: Crypto.Cipher.ARC4.new(...)
      - pattern-not: hashlib.$H(..., usedforsecurity=False, ...)
    metadata:
      category: security
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      confidence: HIGH
