rules:
  - id: shipguard.python.ssrf
    languages: [python]
    mode: taint
    severity: ERROR
    message: >-
      A URL taken from the HTTP request is fetched by the server, which lets an
      attacker reach internal services and cloud metadata endpoints. Only
      accept destinations from an allow-list, or build the URL from a fixed
      host and validate the user-supplied part.
    pattern-sources:
      - pattern: request.args.get(...)
      - pattern: request.args[...]
      - pattern: request.form.get(...)
      - pattern: request.form[...]
      - pattern: request.GET.get(...)
      - pattern: request.POST.get(...)
    pattern-sinks:
      # requests.get(url) / httpx.get(url): the URL is the first argument.
      # For the generic request(method, url) form the first argument is the
      # HTTP method, so it is excluded here and matched below.
      - patterns:
          - pattern-either:
              - pattern: requests.$M($URL, ...)
              - pattern: httpx.$M($URL, ...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(?!request$)
          - focus-metavariable: $URL
      - patterns:
          - pattern-either:
              - pattern: requests.request($METHOD, $URL, ...)
              - pattern: httpx.request($METHOD, $URL, ...)
          - focus-metavariable: $URL
      - patterns:
          - pattern-either:
              - pattern: requests.$M(..., url=$URL, ...)
              - pattern: httpx.$M(..., url=$URL, ...)
          - focus-metavariable: $URL
      - patterns:
          - pattern: urllib.request.urlopen($URL, ...)
          - focus-metavariable: $URL
      - patterns:
          - pattern: urlopen($URL, ...)
          - focus-metavariable: $URL
    metadata:
      category: security
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      confidence: MEDIUM
