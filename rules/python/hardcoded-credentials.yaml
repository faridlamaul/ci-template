rules:
  - id: shipguard.python.hardcoded-credentials
    languages: [python]
    severity: WARNING
    message: >-
      A credential-like variable is assigned a string literal, so the secret
      lives in source control. Load it from the environment or a secret manager
      at runtime and rotate the exposed value.
    patterns:
      - pattern-either:
          - pattern: $NAME = "$VALUE"
          - pattern: $C(..., $NAME="$VALUE", ...)
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)^(?!.*(url|name|type|label|path|file)$).*(password|passwd|secret|api_?key|token|credential)
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^(?![a-z][a-z0-9+.-]*://)(?!.*\s).{6,}$
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confidence: LOW
