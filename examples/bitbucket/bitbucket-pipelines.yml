# Bitbucket: bitbucket-pipelines.yml
#
# Replace vX.Y.Z with a shipguard release tag.
pipelines:
  default:
    - step:
        name: security
        script:
          - pipe: docker://ghcr.io/faridlamaul/shipguard:vX.Y.Z
            variables:
              SCANNERS: all
              MODE: enforce
              CONFIG: .shipguard.yaml
