name: Bump scanners

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# One bump at a time: runs share the fixed bump branch.
concurrency:
  group: bump-scanners
  cancel-in-progress: false

jobs:
  bump:
    # Never runs on forks: they have no write token and no business bumping.
    if: github.repository == 'faridlamaul/shipguard'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Also refreshes internal/ci/tools/ci-tools.env and validates that the
      # embedded file still loads (go test) before reporting success.
      - name: Bump pinned scanners and CI tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/bump-scanners.sh

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- versions.env internal/ci/tools/ci-tools.env; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # PRs opened with GITHUB_TOKEN do not trigger other workflows (so CI will
      # not run on the bump PR), which is why the tests run here first.
      - name: Unit tests
        if: steps.diff.outputs.changed == 'true'
        run: make test

      - name: Image end-to-end test
        if: steps.diff.outputs.changed == 'true'
        run: make e2e

      # Runs every language fixture in its official image with the new CI tool
      # pins, so an asset or archive layout change fails here, not after merge.
      - name: shipguard ci end-to-end test
        if: steps.diff.outputs.changed == 'true'
        run: make ci-e2e

      # The bump lives on one fixed branch that every run force-updates, so a
      # newer bump replaces the previous one instead of opening another PR.
      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          branch="chore/bump-scanners"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add versions.env internal/ci/tools/ci-tools.env
          git commit -m "chore(deps): bump pinned scanners and CI tools"
          # Checkout used persist-credentials: false, so authenticate the push
          # explicitly with the job token. The branch is owned by this workflow.
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "HEAD:refs/heads/$branch"
          open_pr="$(gh pr list --repo "$REPOSITORY" --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$open_pr" ]; then
            echo "Updated the open bump PR #$open_pr"
          else
            gh pr create \
              --repo "$REPOSITORY" \
              --head "$branch" \
              --base main \
              --title "chore(deps): bump pinned scanners and CI tools" \
              --body "Automated bump of gitleaks, opengrep, osv-scanner and trivy in versions.env, and of the CI tools (golangci-lint, gotestsum, ruff, uv, cargo-nextest, bun) in internal/ci/tools/ci-tools.env. Every pinned checksum was computed from the downloaded asset and matched against each upstream source that exists (the GitHub asset digest and the project's published checksum file; at least one is required); the new ci-tools.env pins load (go test TestLoadEmbedded). Unit tests, the image end-to-end test (make e2e) and the shipguard ci end-to-end test (make ci-e2e: every language fixture in its official image, using the new CI tool pins) passed in the bump workflow."
          fi
