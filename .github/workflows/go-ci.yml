name: Reusable Go CI

on:
  workflow_call:
    inputs:
      go_version:
        description: "Go version to set up"
        type: string
        default: "1.22"
        required: false
      run_lint:
        description: "Run golangci-lint check"
        type: boolean
        default: true
        required: false
      run_tests:
        description: "Run go test suite with race detector and coverage"
        type: boolean
        default: true
        required: false
      run_build:
        description: "Run go build validation"
        type: boolean
        default: true
        required: false
      build_output:
        description: "Binary output path"
        type: string
        default: "bin/app"
        required: false
      build_package:
        description: "Package to build"
        type: string
        default: "./..."
        required: false

jobs:
  lint:
    if: inputs.run_lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
        continue-on-error: true

  test:
    if: inputs.run_tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
          cache: true

      - name: Run tests with race detector and coverage
        run: |
          go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...
          go tool cover -func=coverage.txt

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage-report
          path: coverage.txt
          retention-days: 7

  build:
    if: inputs.run_build
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
          cache: true

      - name: Verify build compilation
        run: |
          CGO_ENABLED=0 go build -v -ldflags="-s -w" -o ${{ inputs.build_output }} ${{ inputs.build_package }}
