name: Reusable Go CI

on:
  workflow_call:
    inputs:
      go_version:
        description: "Go version to set up"
        type: string
        default: "1.22"
        required: false
      run_lint:
        description: "Run golangci-lint check"
        type: boolean
        default: true
        required: false
      run_tests:
        description: "Run go test suite with race detector and coverage"
        type: boolean
        default: true
        required: false
      run_build:
        description: "Run go build validation"
        type: boolean
        default: true
        required: false
      build_output:
        description: "Binary output path"
        type: string
        default: "bin/app"
        required: false
      build_package:
        description: "Package to build"
        type: string
        default: "./..."
        required: false

permissions:
  contents: read

jobs:
  lint:
    if: inputs.run_lint
    runs-on: ubuntu-latest
    steps:
      - name: Deprecation notice
        run: echo "::warning title=Deprecated::go-ci is deprecated; use faridlamaul/shipguard/.github/workflows/build-test.yml (see docs/ci.md). It will be removed in the next major release."

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # golangci-lint v2 needs a v2 config: consumers with a v1
          # .golangci.yml must migrate, see
          # https://golangci-lint.run/docs/product/migration-guide/
          # Mirrors internal/ci/tools/ci-tools.env; update together.
          version: v2.15.0

  test:
    if: inputs.run_tests
    runs-on: ubuntu-latest
    steps:
      - name: Deprecation notice
        run: echo "::warning title=Deprecated::go-ci is deprecated; use faridlamaul/shipguard/.github/workflows/build-test.yml (see docs/ci.md). It will be removed in the next major release."

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
          cache: true

      - name: Run tests with race detector and coverage
        run: |
          go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...
          go tool cover -func=coverage.txt

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage-report
          path: coverage.txt
          retention-days: 7

  build:
    if: inputs.run_build
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Deprecation notice
        run: echo "::warning title=Deprecated::go-ci is deprecated; use faridlamaul/shipguard/.github/workflows/build-test.yml (see docs/ci.md). It will be removed in the next major release."

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
          cache: true

      - name: Verify build compilation
        env:
          BUILD_OUTPUT: ${{ inputs.build_output }}
          BUILD_PACKAGE: ${{ inputs.build_package }}
        run: |
          set -f
          read -r -a pkgs <<<"$BUILD_PACKAGE"
          CGO_ENABLED=0 go build -v -ldflags="-s -w" -o "$BUILD_OUTPUT" "${pkgs[@]}"
