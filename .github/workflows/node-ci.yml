name: Reusable Node CI

on:
  workflow_call:
    inputs:
      node_version:
        description: "Node.js version to set up"
        type: string
        default: "20"
        required: false
      package_manager:
        description: "Package manager: npm, pnpm, yarn, or bun"
        type: string
        default: "npm"
        required: false
      run_lint:
        description: "Run npm run lint"
        type: boolean
        default: true
        required: false
      run_tests:
        description: "Run npm test"
        type: boolean
        default: true
        required: false
      run_build:
        description: "Run npm run build"
        type: boolean
        default: true
        required: false

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Deprecation notice
        run: echo "::warning title=Deprecated::node-ci is deprecated; use faridlamaul/shipguard/.github/workflows/build-test.yml (see docs/ci.md). It will be removed in the next major release."

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate package manager
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            npm|pnpm|yarn) ;;
            bun) echo "::error::bun is supported by build-test.yml (see docs/ci.md)"; exit 1 ;;
            *) echo "::error::unsupported package_manager '$PACKAGE_MANAGER'"; exit 1 ;;
          esac

      - name: Enable corepack
        if: inputs.package_manager == 'pnpm' || inputs.package_manager == 'yarn'
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
        run: |
          if ! node -e 'const p=(require("./package.json").packageManager||"").split("@")[0]; process.exit(p===process.env.PACKAGE_MANAGER ? 0 : 1)'; then
            echo "::error::$PACKAGE_MANAGER requires \"packageManager\" in package.json (e.g. \"$PACKAGE_MANAGER@9.x.y\"); build-test.yml documents the same rule"
            exit 1
          fi
          corepack enable "$PACKAGE_MANAGER"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ inputs.package_manager == 'pnpm' && 'pnpm' || inputs.package_manager == 'yarn' && 'yarn' || 'npm' }}

      - name: Install dependencies
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
        run: |
          if [ "$PACKAGE_MANAGER" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          elif [ "$PACKAGE_MANAGER" = "yarn" ]; then
            if [ -f .yarnrc.yml ]; then
              yarn install --immutable
            else
              yarn install --frozen-lockfile
            fi
          else
            npm ci
          fi

      - name: Run linter
        if: inputs.run_lint
        run: |
          if node -e 'process.exit(Object.keys(require("./package.json").scripts || {}).includes("lint") ? 0 : 1)'; then
            npm run lint
          else
            echo "No lint script defined in package.json, skipping."
          fi

      - name: Run tests
        if: inputs.run_tests
        run: |
          if node -e 'process.exit(Object.keys(require("./package.json").scripts || {}).includes("test") ? 0 : 1)'; then
            npm run test
          else
            echo "No test script defined in package.json, skipping."
          fi

      - name: Run build
        if: inputs.run_build
        run: |
          if node -e 'process.exit(Object.keys(require("./package.json").scripts || {}).includes("build") ? 0 : 1)'; then
            npm run build
          else
            echo "No build script defined in package.json, skipping."
          fi
