name: Reusable GoReleaser

on:
  workflow_call:
    inputs:
      go_version:
        description: "Go version to set up"
        type: string
        default: "stable"
        required: false
      goreleaser_version:
        description: "GoReleaser version specification"
        type: string
        default: "~> v2"
        required: false
      distribution:
        description: "GoReleaser distribution: goreleaser or goreleaser-pro"
        type: string
        default: "goreleaser"
        required: false
      args:
        description: "GoReleaser arguments"
        type: string
        default: "release --clean"
        required: false
      version:
        description: "Specific git tag to checkout before releasing (optional)"
        type: string
        default: ""
        required: false
    secrets:
      token:
        description: "GitHub token with contents:write permission"
        required: false

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch all git tags
        run: git fetch --tags --force

      - name: Checkout target tag
        if: inputs.version != ''
        run: git checkout ${{ inputs.version }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: ${{ inputs.distribution }}
          version: ${{ inputs.goreleaser_version }}
          args: ${{ inputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.token || secrets.GITHUB_TOKEN }}
