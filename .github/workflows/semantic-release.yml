# DEPRECATED: semantic-release.yml is deprecated; use release-artifacts.yml (see docs/release.md).
name: Reusable Semantic Release

on:
  workflow_call:
    inputs:
      bump:
        description: "Version bump type: auto, major, minor, or patch"
        type: string
        default: "auto"
        required: false
      version:
        description: "Explicit version override (e.g. 1.0.0 or v1.0.0)"
        type: string
        default: ""
        required: false
      dry_run:
        description: "Preview version bump and release notes without making remote changes"
        type: boolean
        default: false
        required: false
      draft:
        description: "Create release as draft"
        type: boolean
        default: false
        required: false
      prerelease:
        description: "Prerelease identifier (e.g. rc creates vX.Y.Z-rc.N); empty for a stable release"
        type: string
        default: ""
        required: false
      shiptag_image:
        description: "shiptag container image (https://github.com/faridlamaul/shiptag)"
        type: string
        # Pinned by digest. Dependabot does not read workflow inputs, so bump
        # the tag and digest by hand when shiptag releases.
        default: "ghcr.io/faridlamaul/shiptag:0.3.0@sha256:ceb24020c15259f0d39f035edb8c0948ab2342c9cbbb03d4a85b8ee108453464"
        required: false
    outputs:
      version:
        description: "The newly released tag (e.g. v1.2.3); empty when nothing was released"
        value: ${{ jobs.release.outputs.version }}
      released:
        description: "True if a new tag/release was published"
        value: ${{ jobs.release.outputs.released }}
    secrets:
      token:
        description: "GitHub token with contents:write permission"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.shiptag.outputs.version }}
      released: ${{ steps.shiptag.outputs.released }}
    steps:
      - name: Deprecation notice
        run: echo "::warning::semantic-release.yml is deprecated; use release-artifacts.yml (see docs/release.md)"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run shiptag
        id: shiptag
        env:
          GITHUB_TOKEN: ${{ secrets.token || secrets.GITHUB_TOKEN }}
          IMAGE: ${{ inputs.shiptag_image }}
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          args=(tag)
          if [ -n "$BUMP" ]; then args+=(--bump "$BUMP"); fi
          if [ -n "$VERSION" ]; then args+=(--version "$VERSION"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$DRAFT" = "true" ]; then args+=(--draft); fi
          if [ -n "$PRERELEASE" ]; then args+=(--prerelease "$PRERELEASE"); fi

          # shiptag detects GitHub Actions from these variables and writes its
          # outputs (released, version, tag, ...) to the mounted file. A dry run
          # writes none.
          docker run --rm \
            -e GITHUB_ACTIONS -e GITHUB_REPOSITORY -e GITHUB_SHA \
            -e GITHUB_SERVER_URL -e GITHUB_API_URL -e GITHUB_TOKEN \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            -v "$RUNNER_TEMP:/runner-temp" \
            "$IMAGE" "${args[@]}" --output-file /runner-temp/shiptag-outputs

          outputs="$RUNNER_TEMP/shiptag-outputs"
          released="$(sed -n 's/^released=//p' "$outputs" 2>/dev/null || true)"
          tag="$(sed -n 's/^tag=//p' "$outputs" 2>/dev/null || true)"
          if [ "$released" = "true" ]; then
            echo "version=${tag}" >> "$GITHUB_OUTPUT"
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
