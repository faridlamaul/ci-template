name: CI

# Lints every workflow here, so a broken reusable workflow fails in this
# repository instead of in the repositories that call it.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image bundles shellcheck, so run: scripts are checked too.
      # Dependabot does not update images inside run:, so bump it by hand.
      - name: Lint workflows
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color
