name: Adapter CI

# Self-test of the GitHub build and test adapter: the composite action on a
# passing and a failing fixture, and the reusable workflow.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  composite-pass:
    name: Composite action (go, passes)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run composite action
        uses: ./adapters/github/ci
        with:
          dir: testdata/ci/go/pass

  composite-fail:
    name: Composite action (node, fails)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run composite action
        id: ci
        continue-on-error: true
        uses: ./adapters/github/ci
        with:
          dir: testdata/ci/node/fail-test

      - name: Assert the run failed
        env:
          OUTCOME: ${{ steps.ci.outcome }}
        run: |
          echo "outcome=$OUTCOME"
          test "$OUTCOME" = "failure"

  reusable:
    name: Reusable workflow (python, passes)
    permissions:
      contents: read
    uses: ./.github/workflows/build-test.yml
    with:
      dir: testdata/ci/python/pass
